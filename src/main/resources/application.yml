spring:
  application:
    name: smartgn-installation-device-management
  datasource:
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/installation_db}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:smartgn_installation}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    hikari:
      maximum-pool-size: 12
      connection-init-sql: SET search_path TO installation
  flyway:
    enabled: true
    schemas: installation
    default-schema: installation
    create-schemas: true
server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
smartgn:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ${JWT_ISSUER:smartgn-iam-service}
    jwt-audience: ${JWT_AUDIENCE:smartgn-api}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  devices:
    credential-key: ${DEVICE_CREDENTIAL_KEY}
  telemetry:
    base-url: ${TELEMETRY_BASE_URL:http://localhost:8090}
    service-token: ${INTERNAL_SERVICE_TOKEN}
  broker:
    base-url: ${EMQX_API_URL:http://localhost:18083/api/v5}
    api-key: ${EMQX_API_KEY:}
    api-secret: ${EMQX_API_SECRET:}
    username: ${EMQX_USERNAME:admin}
    password: ${EMQX_PASSWORD}
