name: smartgn-local
services:
  iam-db:
    image: postgres:18
    environment:
      POSTGRES_DB: iam_db
      POSTGRES_USER: smartgn_iam
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:?Generate local configuration}
    volumes: [iam-data:/var/lib/postgresql]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U smartgn_iam -d iam_db"]
      interval: 3s
      timeout: 3s
      retries: 30
  installation-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: installation_db
      POSTGRES_USER: smartgn_installation
      POSTGRES_PASSWORD: ${INSTALLATION_DB_PASSWORD:?Generate local configuration}
    volumes: [installation-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U smartgn_installation -d installation_db"]
      interval: 3s
      timeout: 3s
      retries: 30
  broker:
    image: emqx/emqx:5.8.8
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_PASSWORD:?Generate local configuration}
      EMQX_API_KEY__BOOTSTRAP_FILE: /opt/emqx/etc/bootstrap-api-keys
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__CACHE__ENABLE: "false"
      EMQX_AUTHORIZATION__SOURCES: '[{type = built_in_database, enable = true}]'
      EMQX_AUTHENTICATION: '[{mechanism = password_based, backend = built_in_database, user_id_type = username}]'
    volumes:
      - ./.local/emqx-api-keys:/opt/emqx/etc/bootstrap-api-keys:ro
      - broker-data:/opt/emqx/data
    ports: ["127.0.0.1:1883:1883", "127.0.0.1:18083:18083"]
  telemetry:
    image: python:3.13-slim
    command: [python, /tools/local-telemetry-simulator.py]
    environment:
      TELEMETRY_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SIMULATOR_ADMIN_TOKEN: ${FIXTURE_ADMIN_TOKEN}
      SIMULATOR_DB: /data/telemetry.sqlite
      PORT: "8090"
    volumes: ["./tools:/tools:ro", "telemetry-data:/data"]
    ports: ["127.0.0.1:8090:8090"]
  future-services:
    image: python:3.13-slim
    command: [python, /tools/local-future-services.py]
    environment:
      FIXTURE_ADMIN_TOKEN: ${FIXTURE_ADMIN_TOKEN}
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN}
      BILLING_FIXTURE_TOKEN: ${BILLING_FIXTURE_TOKEN}
      EVENT_FIXTURE_TOKEN: ${EVENT_FIXTURE_TOKEN}
    volumes: ["./tools:/tools:ro", "fixture-data:/data"]
    ports: ["127.0.0.1:8091:8091"]
  iam:
    build: ${IAM_REPO_PATH:-../smartgn-iam}
    environment:
      DB_URL: jdbc:postgresql://iam-db:5432/iam_db
      DB_USERNAME: smartgn_iam
      DB_PASSWORD: ${IAM_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      DELIVERY_ENCRYPTION_KEY: ${DELIVERY_ENCRYPTION_KEY}
      NOTIFICATION_DELIVERY_URL: http://future-services:8091/local-contracts/notifications
      NOTIFICATION_SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN}
      INSTALLATION_BASE_URL: http://installation:8081
      BILLING_FIXTURE_URL: http://future-services:8091
      BILLING_FIXTURE_TOKEN: ${BILLING_FIXTURE_TOKEN}
      IDENTITY_EVENT_SINK_URL: http://future-services:8091/local-contracts/events
      IDENTITY_EVENT_SINK_TOKEN: ${EVENT_FIXTURE_TOKEN}
      SPRING_PROFILES_ACTIVE: local-bootstrap
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      iam-db: {condition: service_healthy}
  installation:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://installation-db:5432/installation_db
      SPRING_DATASOURCE_USERNAME: smartgn_installation
      SPRING_DATASOURCE_PASSWORD: ${INSTALLATION_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_AUDIENCE: smartgn-api
      DEVICE_CREDENTIAL_KEY: ${DEVICE_CREDENTIAL_KEY}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      TELEMETRY_BASE_URL: http://telemetry:8090
      EMQX_API_URL: http://broker:18083/api/v5
      EMQX_API_KEY: ${EMQX_API_KEY}
      EMQX_API_SECRET: ${EMQX_API_SECRET}
      EMQX_PASSWORD: ${EMQX_PASSWORD}
      SMARTGN_IAM_BASE_URL: http://iam:8080
      SMARTGN_EVENTS_SINK_URL: http://future-services:8091/local-contracts/events
      SMARTGN_EVENTS_SINK_TOKEN: ${EVENT_FIXTURE_TOKEN}
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      installation-db: {condition: service_healthy}
volumes:
  iam-data:
  installation-data:
  broker-data:
  telemetry-data:
  fixture-data:
